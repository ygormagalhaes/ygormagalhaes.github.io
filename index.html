<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wormhole</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Setup Three.js
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000);
    document.body.appendChild(renderer.domElement);

    camera.position.z = 0;

    // Criar buraco de minhoca
    const rings = [];
    const ringCount = 50;
    const segmentsPerRing = 128;

    for (let i = 0; i < ringCount; i++) {
      const points = [];
      const zPos = (i - ringCount / 2) * 0.8;
      const radius = 1 + (i / ringCount) * 4;

      for (let j = 0; j <= segmentsPerRing; j++) {
        const angle = (j / segmentsPerRing) * Math.PI * 2;
        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;
        points.push(new THREE.Vector3(x, y, zPos));
      }

      const geometry = new THREE.BufferGeometry().setFromPoints(points);
      const material = new THREE.LineBasicMaterial({ color: 0x00ffff });
      const line = new THREE.Line(geometry, material);
      scene.add(line);
      rings.push({ line, initialZ: zPos });
    }

    // Gesture recognition
    let isDrawing = false;
    let lastX = 0, lastY = 0;
    let strokePoints = [];
    const threshold = 15;

    function normalizeStroke(points) {
      if (points.length < 2) return null;

      const minX = Math.min(...points.map(p => p.x));
      const maxX = Math.max(...points.map(p => p.x));
      const minY = Math.min(...points.map(p => p.y));
      const maxY = Math.max(...points.map(p => p.y));

      const width = maxX - minX || 1;
      const height = maxY - minY || 1;

      return points.map(p => ({
        x: (p.x - minX) / width,
        y: (p.y - minY) / height
      }));
    }

    function recognize(normalized) {
      if (!normalized || normalized.length < 5) return null;

      let curveScore = 0;
      for (let i = 1; i < normalized.length - 1; i++) {
        const dx = normalized[i + 1].x - normalized[i].x;
        const dy = normalized[i + 1].y - normalized[i].y;
        const px = normalized[i].x - normalized[i - 1].x;
        const py = normalized[i].y - normalized[i - 1].y;
        curveScore += Math.abs(dx * py - dy * px);
      }
      curveScore /= normalized.length;

      const heights = normalized.map(p => p.y);
      const minH = Math.min(...heights);
      const maxH = Math.max(...heights);
      const isVertical = (maxH - minH) > 0.4;

      const widths = normalized.map(p => p.x);
      const minW = Math.min(...widths);
      const maxW = Math.max(...widths);
      const isWide = (maxW - minW) > 0.5;

      if (curveScore > 0.06 && isVertical && normalized[0].x < 0.4) {
        return 'P';
      }

      if (curveScore > 0.12 && isWide && isVertical) {
        return 'W';
      }

      return null;
    }

    function handleGesture() {
      const normalized = normalizeStroke(strokePoints);
      const char = recognize(normalized);

      if (char === 'P') {
        window.location.href = 'pixel-lab.html';
      } else if (char === 'W') {
        window.location.href = 'simulador-wb-xt30ii.html';
      }
    }

    renderer.domElement.addEventListener('mousedown', (e) => {
      isDrawing = true;
      strokePoints = [];
      lastX = e.clientX;
      lastY = e.clientY;
      strokePoints.push({ x: lastX, y: lastY });
    });

    renderer.domElement.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;
      const x = e.clientX;
      const y = e.clientY;
      const dist = Math.hypot(x - lastX, y - lastY);

      if (dist > threshold) {
        strokePoints.push({ x, y });
        lastX = x;
        lastY = y;
      }
    });

    renderer.domElement.addEventListener('mouseup', () => {
      if (!isDrawing) return;
      isDrawing = false;
      handleGesture();
      strokePoints = [];
    });

    renderer.domElement.addEventListener('touchstart', (e) => {
      const touch = e.touches[0];
      isDrawing = true;
      strokePoints = [];
      lastX = touch.clientX;
      lastY = touch.clientY;
      strokePoints.push({ x: lastX, y: lastY });
    });

    renderer.domElement.addEventListener('touchmove', (e) => {
      if (!isDrawing) return;
      e.preventDefault();
      const touch = e.touches[0];
      const x = touch.clientX;
      const y = touch.clientY;
      const dist = Math.hypot(x - lastX, y - lastY);

      if (dist > threshold) {
        strokePoints.push({ x, y });
        lastX = x;
        lastY = y;
      }
    });

    renderer.domElement.addEventListener('touchend', () => {
      if (!isDrawing) return;
      isDrawing = false;
      handleGesture();
      strokePoints = [];
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);

      const time = Date.now() * 0.0008;

      rings.forEach((item) => {
        item.line.position.z = item.initialZ + time * 20;

        if (item.line.position.z > 50) {
          item.line.position.z -= ringCount * 0.8;
        }

        const opacity = 0.2 + 0.8 * Math.abs(Math.sin(item.line.position.z * 0.1));
        item.line.material.opacity = opacity;
      });

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
