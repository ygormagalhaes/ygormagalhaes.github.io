<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wormhole</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <script src="three.min.js"></script>
  <script>
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.015);

    const camera = new THREE.PerspectiveCamera(85, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, precision: 'highp', powerPreference: 'high-performance' });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000);
    document.body.appendChild(renderer.domElement);

    // ---------- tunnel parameters ----------
    const VISIBLE_RINGS = 80;
    const SEG = 96;
    const SPACING = 1.8;
    const RADIUS = 6.5;

    const positions = [];
    const colors = [];
    const color = new THREE.Color();

    function generateRing(ringIndex) {
      const z = -ringIndex * SPACING;
      const mainCurveX = Math.sin(ringIndex * 0.08) * 6 + Math.sin(ringIndex * 0.02) * 4;
      const mainCurveY = Math.cos(ringIndex * 0.06) * 5 + Math.sin(ringIndex * 0.03) * 4 + Math.cos(ringIndex * 0.01) * 3;
      const loopX = Math.sin(ringIndex * 0.15) * 2;
      const loopY = Math.cos(ringIndex * 0.12) * 2;

      const verts = [];
      const cols = [];

      for (let j = 0; j < SEG; j++) {
        const a = (j / SEG) * Math.PI * 2;
        const x = Math.cos(a) * RADIUS + mainCurveX + loopX;
        const y = Math.sin(a) * RADIUS + mainCurveY + loopY;
        verts.push(x, y, z);

        const hue = (0.5 + (ringIndex % 200) * 0.002) % 1;
        color.setHSL(hue, 1.0, 0.4);
        cols.push(color.r, color.g, color.b);
      }
      return { verts, cols };
    }

    // Gerar geometria inicial
    for (let i = 0; i < VISIBLE_RINGS; i++) {
      const ring = generateRing(i);
      positions.push(...ring.verts);
      colors.push(...ring.cols);
    }

    const idx = [];
    for (let i = 0; i < VISIBLE_RINGS; i++) {
      for (let j = 0; j < SEG; j++) {
        const cur = i * SEG + j;
        const nextJ = i * SEG + (j + 1) % SEG;
        idx.push(cur, nextJ);
        if (i < VISIBLE_RINGS - 1) idx.push(cur, cur + SEG);
      }
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    geo.setIndex(idx);

    const mat = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.95, fog: true });
    const tunnel = new THREE.LineSegments(geo, mat);
    scene.add(tunnel);

    // ---------- sliding window system ----------
    let ringOffset = 0;
    let distanceAccum = 0;
    const UPDATE_DISTANCE = SPACING * 3;

    function updateGeometry() {
      const pos_arr = geo.attributes.position.array;
      const col_arr = geo.attributes.color.array;

      for (let i = 0; i < VISIBLE_RINGS; i++) {
        const ring = generateRing(ringOffset + i);
        const verts = ring.verts;
        const cols = ring.cols;

        for (let j = 0; j < SEG; j++) {
          const idx = (i * SEG + j) * 3;
          pos_arr[idx] = verts[j * 3];
          pos_arr[idx + 1] = verts[j * 3 + 1];
          pos_arr[idx + 2] = verts[j * 3 + 2] - distanceAccum;

          col_arr[idx] = cols[j * 3];
          col_arr[idx + 1] = cols[j * 3 + 1];
          col_arr[idx + 2] = cols[j * 3 + 2];
        }
      }

      geo.attributes.position.needsUpdate = true;
      geo.attributes.color.needsUpdate = true;
    }

    // ---------- distortion ----------
    let distortionAmount = 0;
    let targetDistortion = 0;
    let lastDistortionTime = 0;
    const DISTORTION_DURATION = 500;

    function applyDistortion() {
      const pos_arr = geo.attributes.position.array;

      for (let i = 0; i < VISIBLE_RINGS; i++) {
        const distortWave = Math.sin(i * 0.08 + distortionAmount * 2) * distortionAmount;

        for (let j = 0; j < SEG; j++) {
          const angle = (j / SEG) * Math.PI * 2;
          const radiusScale = 1 + distortWave * Math.sin(angle * 4);

          const ring = generateRing(ringOffset + i);
          const baseX = ring.verts[j * 3];
          const baseY = ring.verts[j * 3 + 1];
          const baseZ = ring.verts[j * 3 + 2] - distanceAccum;

          const distX = Math.cos(angle) * RADIUS * (radiusScale - 1);
          const distY = Math.sin(angle) * RADIUS * (radiusScale - 1);

          const idx = (i * SEG + j) * 3;
          pos_arr[idx] = baseX + distX;
          pos_arr[idx + 1] = baseY + distY;
          pos_arr[idx + 2] = baseZ;
        }
      }

      geo.attributes.position.needsUpdate = true;
    }

    // ---------- input ----------
    renderer.domElement.addEventListener('mousedown', () => { targetDistortion = 0.7; lastDistortionTime = Date.now(); });
    renderer.domElement.addEventListener('mousemove', (e) => { if (e.buttons) { targetDistortion = 0.8; lastDistortionTime = Date.now(); } });
    renderer.domElement.addEventListener('touchstart', () => { targetDistortion = 0.7; lastDistortionTime = Date.now(); }, { passive: true });
    renderer.domElement.addEventListener('touchmove', () => { targetDistortion = 0.8; lastDistortionTime = Date.now(); }, { passive: true });

    // ---------- gyroscope ----------
    let gyroX = 0, gyroY = 0;
    if (window.DeviceOrientationEvent) {
      window.addEventListener('deviceorientation', (e) => {
        gyroY = gyroY * 0.92 + (e.gamma || 0) / 5 * 0.08;
        gyroX = gyroX * 0.92 + (e.beta || 0) / 5 * 0.08;
      }, true);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ---------- animation ----------
    const SPEED = 1.2;

    function animate() {
      requestAnimationFrame(animate);

      // Movimento
      distanceAccum += SPEED;

      if (distanceAccum >= UPDATE_DISTANCE) {
        const advance = Math.floor(distanceAccum / SPACING);
        ringOffset += advance;
        distanceAccum -= advance * SPACING;
        updateGeometry();
      }

      // Câmera
      camera.position.x = gyroY * 0.3;
      camera.position.y = gyroX * 0.3;
      camera.position.z = 0;
      camera.lookAt(0, 0, -20);

      // Distorção
      const now = Date.now();
      const timeSince = now - lastDistortionTime;

      if (timeSince < DISTORTION_DURATION) {
        const progress = timeSince / DISTORTION_DURATION;
        const easing = 1 - Math.pow(1 - progress, 3);
        distortionAmount = targetDistortion * (1 - easing);
        applyDistortion();
      } else {
        distortionAmount = 0;
      }

      // Cores e rotação
      const baseWave = Math.sin(Date.now() * 0.0003) * 0.1;
      tunnel.rotation.z += 0.003;

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
