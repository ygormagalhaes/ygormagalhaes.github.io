<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixelador</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Bricolage+Grotesque:opsz,wght@12..96,700&display=swap');

  :root {
    --bg: #0e0e10;
    --panel: #18181c;
    --line: #2a2a30;
    --text: #e8e6e0;
    --dim: #7a7a82;
    --accent: #d6ff3f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(214,255,63,0.06), transparent 40%),
      radial-gradient(circle at 85% 100%, rgba(214,255,63,0.04), transparent 40%);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    padding: 40px 20px;
  }

  .wrap { max-width: 1100px; margin: 0 auto; }

  header { margin-bottom: 32px; }
  h1 {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: clamp(2.2rem, 6vw, 3.6rem);
    line-height: 0.95;
    letter-spacing: -0.02em;
  }
  h1 .blink { color: var(--accent); }
  header p { color: var(--dim); font-size: 0.85rem; margin-top: 10px; }

  .layout { display: grid; grid-template-columns: 300px 1fr; gap: 24px; }
  @media (max-width: 720px) { .layout { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 22px;
  }

  .field { margin-bottom: 26px; }
  .field:last-child { margin-bottom: 0; }

  label {
    display: block;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--dim);
    margin-bottom: 10px;
  }
  label .val { color: var(--accent); float: right; }

  .upload {
    display: block;
    border: 1px dashed var(--line);
    border-radius: 4px;
    padding: 28px 14px;
    text-align: center;
    cursor: pointer;
    font-size: 0.8rem;
    color: var(--dim);
    transition: border-color .15s, color .15s, background .15s;
  }
  .upload:hover { border-color: var(--accent); color: var(--text); background: rgba(214,255,63,0.03); }
  .upload input { display: none; }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 3px;
    background: var(--line); border-radius: 3px; outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent); cursor: pointer;
    border: 3px solid var(--bg);
  }
  input[type=range]::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent); cursor: pointer; border: 3px solid var(--bg);
  }

  select {
    width: 100%;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 0.8rem;
    cursor: pointer;
  }
  select:focus { outline: none; border-color: var(--accent); }

  button {
    width: 100%;
    background: var(--accent);
    color: #0e0e10;
    border: none;
    border-radius: 4px;
    padding: 12px;
    font-family: inherit;
    font-weight: 500;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: opacity .15s;
  }
  button:hover { opacity: 0.85; }
  button:disabled { background: var(--line); color: var(--dim); cursor: not-allowed; }

  .stage {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    min-height: 420px;
    display: flex; align-items: center; justify-content: center;
    padding: 22px;
    background-image:
      linear-gradient(45deg, #141417 25%, transparent 25%),
      linear-gradient(-45deg, #141417 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #141417 75%),
      linear-gradient(-45deg, transparent 75%, #141417 75%);
    background-size: 22px 22px;
    background-position: 0 0, 0 11px, 11px -11px, -11px 0;
  }
  .stage .empty { color: var(--dim); font-size: 0.8rem; text-align: center; }
  canvas { max-width: 100%; max-height: 70vh; border-radius: 2px; image-rendering: pixelated; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>PIXEL<span class="blink">.</span>LAB</h1>
    <p>// pixelador de imagens — tudo roda no seu navegador, nada é enviado</p>
  </header>

  <div class="layout">
    <div class="panel">
      <div class="field">
        <label>Imagem</label>
        <label class="upload">
          <span id="uploadLabel">clique ou arraste um arquivo</span>
          <input type="file" id="file" accept="image/*">
        </label>
      </div>

      <div class="field">
        <label>Intensidade <span class="val" id="intVal">12 px</span></label>
        <input type="range" id="intensity" min="2" max="80" value="12">
      </div>

      <div class="field">
        <label>Formato dos pixels</label>
        <select id="shape">
          <option value="square">Quadrado</option>
          <option value="circle">Círculo</option>
        </select>
      </div>

      <div class="field">
        <button id="download" disabled>Baixar imagem</button>
      </div>
    </div>

    <div class="stage" id="stage">
      <div class="empty" id="empty">— sem imagem —<br>suba um arquivo para começar</div>
      <canvas id="canvas" style="display:none"></canvas>
    </div>
  </div>
</div>

<script>
  const fileInput = document.getElementById('file');
  const intensity = document.getElementById('intensity');
  const intVal    = document.getElementById('intVal');
  const shape     = document.getElementById('shape');
  const canvas    = document.getElementById('canvas');
  const ctx       = canvas.getContext('2d');
  const empty     = document.getElementById('empty');
  const downloadBtn = document.getElementById('download');
  const uploadLabel = document.getElementById('uploadLabel');

  let img = null;

  fileInput.addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    uploadLabel.textContent = f.name;
    const reader = new FileReader();
    reader.onload = ev => {
      img = new Image();
      img.onload = () => {
        empty.style.display = 'none';
        canvas.style.display = 'block';
        downloadBtn.disabled = false;
        render();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(f);
  });

  intensity.addEventListener('input', () => {
    intVal.textContent = intensity.value + ' px';
    if (img) render();
  });
  shape.addEventListener('change', () => { if (img) render(); });

  function render() {
    const block = parseInt(intensity.value, 10);

    // limita o tamanho para manter performance
    const maxDim = 1400;
    let w = img.width, h = img.height;
    if (w > maxDim || h > maxDim) {
      const r = Math.min(maxDim / w, maxDim / h);
      w = Math.round(w * r);
      h = Math.round(h * r);
    }
    canvas.width = w;
    canvas.height = h;

    // desenha pequeno e lê os blocos médios
    const cols = Math.max(1, Math.round(w / block));
    const rows = Math.max(1, Math.round(h / block));

    const tmp = document.createElement('canvas');
    tmp.width = cols; tmp.height = rows;
    const tctx = tmp.getContext('2d');
    tctx.drawImage(img, 0, 0, cols, rows);
    const data = tctx.getImageData(0, 0, cols, rows).data;

    ctx.clearRect(0, 0, w, h);
    const cw = w / cols, ch = h / rows;
    const isCircle = shape.value === 'circle';

    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const i = (y * cols + x) * 4;
        ctx.fillStyle = `rgba(${data[i]},${data[i+1]},${data[i+2]},${data[i+3]/255})`;
        if (isCircle) {
          ctx.beginPath();
          ctx.arc(x*cw + cw/2, y*ch + ch/2, Math.min(cw, ch)/2, 0, Math.PI*2);
          ctx.fill();
        } else {
          ctx.fillRect(Math.floor(x*cw), Math.floor(y*ch), Math.ceil(cw), Math.ceil(ch));
        }
      }
    }
  }

  downloadBtn.addEventListener('click', () => {
    const a = document.createElement('a');
    a.download = 'pixelado.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  });
</script>
</body>
</html>
