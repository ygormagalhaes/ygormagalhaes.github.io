<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wormhole</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <script src="three.min.js"></script>
  <script>
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.012);

    const camera = new THREE.PerspectiveCamera(80, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000);
    document.body.appendChild(renderer.domElement);

    // ---------- tunnel mesh (curvy tunnel) ----------
    const RINGS = 120;
    const SEG = 64;
    const SPACING = 2;
    const RADIUS = 6;

    const positions = [];
    const colors = [];
    const color = new THREE.Color();

    for (let i = 0; i < RINGS; i++) {
      const z = -i * SPACING;
      const curveAmount = Math.sin(i * 0.03) * 4;
      const curveY = Math.cos(i * 0.025) * 3;

      for (let j = 0; j < SEG; j++) {
        const a = (j / SEG) * Math.PI * 2;
        const x = Math.cos(a) * RADIUS + curveAmount;
        const y = Math.sin(a) * RADIUS + curveY;
        positions.push(x, y, z);
        const t = i / RINGS;
        color.setHSL(0.55 + t * 0.05, 1.0, 0.25 + (1 - t) * 0.45);
        colors.push(color.r, color.g, color.b);
      }
    }

    const idx = [];
    for (let i = 0; i < RINGS; i++) {
      for (let j = 0; j < SEG; j++) {
        const cur = i * SEG + j;
        const nextJ = i * SEG + (j + 1) % SEG;
        idx.push(cur, nextJ);
        if (i < RINGS - 1) idx.push(cur, cur + SEG);
      }
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    geo.setIndex(idx);

    const mat = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.9 });
    const tunnel = new THREE.LineSegments(geo, mat);
    scene.add(tunnel);

    // ---------- color wave animation ----------
    let colorWaveOffset = 0;
    let isSwipingNow = false;

    function updateColorWave() {
      const positions_arr = geo.attributes.position.array;
      const colors_arr = geo.attributes.color.array;

      for (let i = 0; i < RINGS; i++) {
        const z = -i * SPACING;
        const depth = i / RINGS;

        // Onda de cor: muda de acordo com o offset do swipe
        const hueShift = (depth + colorWaveOffset * 0.3) % 1;

        for (let j = 0; j < SEG; j++) {
          const colorIdx = (i * SEG + j) * 3;
          const hue = 0.55 + hueShift * 0.3;
          const c = new THREE.Color().setHSL(hue, 1.0, 0.25 + (1 - depth) * 0.45);
          colors_arr[colorIdx] = c.r;
          colors_arr[colorIdx + 1] = c.g;
          colors_arr[colorIdx + 2] = c.b;
        }
      }
      geo.attributes.color.needsUpdate = true;
    }

    // ---------- line detection system ----------
    let isDrawing = false;
    let startY = 0;
    let lastLineTime = 0;
    const MIN_HEIGHT = window.innerHeight * 0.5;
    const LINE_TIMEOUT = 1500;

    function startLine(e) {
      const y = e.touches ? e.touches[0].clientY : e.clientY;
      isDrawing = true;
      isSwipingNow = true;
      startY = y;
      colorWaveOffset = 0;
    }

    function endLine(e) {
      if (!isDrawing) return;
      isDrawing = false;
      isSwipingNow = false;

      const y = e.touches ? e.changedTouches[0].clientY : e.clientY;
      const distance = Math.abs(y - startY);

      if (distance >= MIN_HEIGHT) {
        const now = Date.now();
        const timeSinceLastLine = now - lastLineTime;

        if (timeSinceLastLine < LINE_TIMEOUT) {
          // Segunda linha dentro do timeout - vai para WB
          console.log('Double line - navigate to WB');
          isSwipingNow = false;
          window.location.href = 'wb-simulator.html';
        } else {
          // Primeira linha - aguarda 1500ms para ver se tem segunda
          lastLineTime = now;
          console.log('Single line - waiting 1500ms');

          setTimeout(() => {
            if ((Date.now() - lastLineTime) >= LINE_TIMEOUT && !isSwipingNow) {
              console.log('Timeout - navigate to Pixel Lab');
              window.location.href = 'pixel-lab.html';
            }
          }, LINE_TIMEOUT);
        }
      }
    }

    function onSwipeMove(e) {
      if (!isSwipingNow) return;
      const y = e.touches ? e.touches[0].clientY : e.clientY;
      const distance = Math.abs(y - startY);
      colorWaveOffset = distance / window.innerHeight;
      updateColorWave();
    }

    const el = renderer.domElement;
    el.addEventListener('mousedown', startLine);
    el.addEventListener('mousemove', onSwipeMove);
    el.addEventListener('mouseup', endLine);
    el.addEventListener('touchstart', startLine, { passive: true });
    el.addEventListener('touchmove', onSwipeMove, { passive: true });
    el.addEventListener('touchend', endLine, { passive: true });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ---------- giroscópio ----------
    let gyroX = 0, gyroY = 0;
    const gyroSmoothing = 0.1;

    if (window.DeviceOrientationEvent) {
      window.addEventListener('deviceorientation', (e) => {
        const beta = e.beta || 0;
        const gamma = e.gamma || 0;

        gyroY = gyroY * (1 - gyroSmoothing) + (gamma / 5) * gyroSmoothing;
        gyroX = gyroX * (1 - gyroSmoothing) + (beta / 5) * gyroSmoothing;

        gyroX = Math.max(-8, Math.min(8, gyroX));
        gyroY = Math.max(-8, Math.min(8, gyroY));
      }, true);
    }

    // ---------- animation loop ----------
    const SPEED = 0.45;
    const GYRO_SCALE = 1;

    function animate() {
      requestAnimationFrame(animate);

      camera.position.z -= SPEED;
      if (camera.position.z <= -SPACING) camera.position.z += SPACING;

      camera.position.x = gyroY * GYRO_SCALE;
      camera.position.y = gyroX * GYRO_SCALE;
      camera.lookAt(0, 0, camera.position.z - 10);

      tunnel.rotation.z += 0.0015;

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
