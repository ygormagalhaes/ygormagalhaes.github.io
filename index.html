<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wormhole</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <script src="three.min.js"></script>
  <script>
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.012);

    const camera = new THREE.PerspectiveCamera(80, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000);
    document.body.appendChild(renderer.domElement);

    // ---------- tunnel mesh (cylindrical grid) ----------
    const RINGS = 90;       // anéis ao longo do túnel
    const SEG = 48;         // segmentos por anel
    const SPACING = 3;      // distância entre anéis (z)
    const RADIUS = 7;       // raio do túnel

    const positions = [];
    const colors = [];
    const color = new THREE.Color();

    // vértices: RINGS x SEG
    for (let i = 0; i < RINGS; i++) {
      const z = -i * SPACING;
      for (let j = 0; j < SEG; j++) {
        const a = (j / SEG) * Math.PI * 2;
        positions.push(Math.cos(a) * RADIUS, Math.sin(a) * RADIUS, z);
        // gradiente de cor por profundidade: azul fundo -> ciano -> branco perto
        const t = i / RINGS;
        color.setHSL(0.55 + t * 0.05, 1.0, 0.25 + (1 - t) * 0.45);
        colors.push(color.r, color.g, color.b);
      }
    }

    const idx = [];
    for (let i = 0; i < RINGS; i++) {
      for (let j = 0; j < SEG; j++) {
        const cur = i * SEG + j;
        const nextJ = i * SEG + (j + 1) % SEG;
        idx.push(cur, nextJ);                  // linha circunferencial
        if (i < RINGS - 1) idx.push(cur, cur + SEG); // linha longitudinal
      }
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    geo.setIndex(idx);

    const mat = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.9 });
    const tunnel = new THREE.LineSegments(geo, mat);
    scene.add(tunnel);

    // ---------- estrelas / partículas ----------
    const starCount = 220;
    const starPos = [];
    for (let i = 0; i < starCount; i++) {
      const a = Math.random() * Math.PI * 2;
      const r = RADIUS * (0.1 + Math.random() * 0.8);
      starPos.push(Math.cos(a) * r, Math.sin(a) * r, -Math.random() * RINGS * SPACING);
    }
    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
    const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.18, transparent: true, opacity: 0.9 });
    const stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);

    // ---------- reconhecimento de gesto ----------
    let drawing = false, lastX = 0, lastY = 0, stroke = [];
    const TH = 14;

    function normalize(pts) {
      if (pts.length < 2) return null;
      const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
      const minX = Math.min(...xs), maxX = Math.max(...xs);
      const minY = Math.min(...ys), maxY = Math.max(...ys);
      const w = maxX - minX || 1, h = maxY - minY || 1;
      return pts.map(p => ({ x: (p.x - minX) / w, y: (p.y - minY) / h }));
    }

    function recognize(n) {
      if (!n || n.length < 5) return null;
      let curve = 0;
      for (let i = 1; i < n.length - 1; i++) {
        const dx = n[i + 1].x - n[i].x, dy = n[i + 1].y - n[i].y;
        const px = n[i].x - n[i - 1].x, py = n[i].y - n[i - 1].y;
        curve += Math.abs(dx * py - dy * px);
      }
      curve /= n.length;
      const ys = n.map(p => p.y), xs = n.map(p => p.x);
      const vertical = (Math.max(...ys) - Math.min(...ys)) > 0.4;
      const wide = (Math.max(...xs) - Math.min(...xs)) > 0.5;
      if (curve > 0.06 && vertical && n[0].x < 0.4) return 'P';
      if (curve > 0.12 && wide && vertical) return 'W';
      return null;
    }

    function finish() {
      const c = recognize(normalize(stroke));
      if (c === 'P') window.location.href = 'pixel-lab.html';
      else if (c === 'W') window.location.href = 'simulador-wb-xt30ii.html';
      stroke = [];
    }

    const el = renderer.domElement;
    el.addEventListener('mousedown', e => { drawing = true; stroke = [{ x: e.clientX, y: e.clientY }]; lastX = e.clientX; lastY = e.clientY; });
    el.addEventListener('mousemove', e => {
      if (!drawing) return;
      if (Math.hypot(e.clientX - lastX, e.clientY - lastY) > TH) { stroke.push({ x: e.clientX, y: e.clientY }); lastX = e.clientX; lastY = e.clientY; }
    });
    el.addEventListener('mouseup', () => { if (drawing) { drawing = false; finish(); } });
    el.addEventListener('touchstart', e => { const t = e.touches[0]; drawing = true; stroke = [{ x: t.clientX, y: t.clientY }]; lastX = t.clientX; lastY = t.clientY; });
    el.addEventListener('touchmove', e => {
      if (!drawing) return; e.preventDefault();
      const t = e.touches[0];
      if (Math.hypot(t.clientX - lastX, t.clientY - lastY) > TH) { stroke.push({ x: t.clientX, y: t.clientY }); lastX = t.clientX; lastY = t.clientY; }
    }, { passive: false });
    el.addEventListener('touchend', () => { if (drawing) { drawing = false; finish(); } });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ---------- loop ----------
    const SPEED = 0.45;
    let t = 0;
    function animate() {
      requestAnimationFrame(animate);
      t += 0.016;

      // câmera voa para dentro do túnel; wrap perfeito a cada SPACING (geometria periódica)
      camera.position.z -= SPEED;
      if (camera.position.z <= -SPACING) camera.position.z += SPACING;

      // leve balanço para dar vida
      camera.position.x = Math.sin(t * 0.3) * 0.6;
      camera.position.y = Math.cos(t * 0.23) * 0.6;
      camera.lookAt(0, 0, camera.position.z - 10);

      // rotação suave do túnel (efeito de torção do wormhole)
      tunnel.rotation.z += 0.0015;

      // partículas fluindo em direção à câmera
      const p = stars.geometry.attributes.position.array;
      for (let i = 0; i < p.length; i += 3) {
        p[i + 2] += SPEED;
        if (p[i + 2] > camera.position.z) p[i + 2] -= RINGS * SPACING;
      }
      stars.geometry.attributes.position.needsUpdate = true;

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
