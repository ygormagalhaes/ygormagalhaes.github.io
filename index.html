<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Lab</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Bricolage+Grotesque:opsz,wght@12..96,700&display=swap');

  :root {
    --bg:      #0e0e10;
    --panel:   #18181c;
    --line:    #2a2a30;
    --text:    #e8e6e0;
    --dim:     #7a7a82;
    --accent:  #d6ff3f;
    --bar:     56px;
    --float-w: 252px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    height: 100dvh;
    overflow: hidden;
    display: flex;
  }

  /* ── Sidebar ── */
  .sidebar {
    width: var(--bar);
    height: 100%;
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 0 12px;
    gap: 2px;
    flex-shrink: 0;
    z-index: 20;
  }

  .logo {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--accent);
    text-align: center;
    line-height: 1.15;
    padding-bottom: 12px;
    margin-bottom: 6px;
    border-bottom: 1px solid var(--line);
    width: 100%;
  }

  .spacer { flex: 1; }

  .icon-btn {
    width: 38px; height: 38px;
    border-radius: 8px;
    background: none;
    border: none;
    color: var(--dim);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .12s, color .12s;
    position: relative;
  }
  .icon-btn:hover { background: rgba(255,255,255,0.06); color: var(--text); }
  .icon-btn.active { background: rgba(214,255,63,0.13); color: var(--accent); }
  .icon-btn svg { width: 17px; height: 17px; }

  /* ── Floating panel ── */
  .float {
    position: absolute;
    left: var(--bar);
    top: 0;
    width: var(--float-w);
    height: 100%;
    background: var(--panel);
    border-right: 1px solid var(--line);
    z-index: 15;
    display: flex;
    flex-direction: column;
    transform: translateX(-100%);
    opacity: 0;
    transition: transform .18s ease, opacity .18s ease;
    pointer-events: none;
  }
  .float.open {
    transform: translateX(0);
    opacity: 1;
    pointer-events: all;
  }

  .float-header {
    padding: 20px 18px 0;
    flex-shrink: 0;
  }
  .float-header h2 {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 1.05rem;
    letter-spacing: -0.02em;
    line-height: 1;
    margin-bottom: 18px;
  }
  .float-body {
    padding: 0 18px 20px;
    overflow-y: auto;
    flex: 1;
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
  }

  /* pane visibility */
  .pane { display: none; }
  .pane.visible { display: block; }

  /* ── Fields ── */
  .field { margin-bottom: 20px; }
  .field:last-child { margin-bottom: 0; }

  .flabel {
    display: block;
    font-size: 0.63rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--dim);
    margin-bottom: 8px;
  }
  .flabel .val { color: var(--accent); float: right; font-size: 0.68rem; }

  .upload-zone {
    display: block;
    border: 1px dashed var(--line);
    border-radius: 6px;
    padding: 26px 10px 20px;
    text-align: center;
    cursor: pointer;
    font-size: 0.72rem;
    color: var(--dim);
    transition: border-color .12s, color .12s, background .12s;
  }
  .upload-zone:hover { border-color: var(--accent); color: var(--text); background: rgba(214,255,63,0.03); }
  .upload-zone input { display: none; }
  .upload-zone .ico { opacity: .4; margin-bottom: 8px; }
  .upload-zone .fname { color: var(--text); font-size: 0.67rem; margin-top: 6px; word-break: break-all; line-height: 1.4; display: none; }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 3px;
    background: var(--line); border-radius: 3px; outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); cursor: pointer;
    border: 2px solid var(--bg);
  }
  input[type=range]::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); cursor: pointer; border: 2px solid var(--bg);
  }

  select {
    width: 100%;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 9px 10px;
    font-family: inherit;
    font-size: 0.72rem;
    cursor: pointer;
    outline: none;
  }
  select:focus { border-color: var(--accent); }

  input[type=color] {
    width: 100%; height: 36px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 5px;
    cursor: pointer;
    padding: 3px 4px;
    outline: none;
  }
  input[type=color]:focus { border-color: var(--accent); }

  .btn {
    width: 100%;
    background: var(--accent);
    color: #0e0e10;
    border: none;
    border-radius: 5px;
    padding: 11px;
    font-family: inherit;
    font-weight: 500;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: opacity .12s;
  }
  .btn + .btn { margin-top: 8px; }
  .btn:hover { opacity: .85; }
  .btn:disabled { background: var(--line); color: var(--dim); cursor: not-allowed; opacity: 1; }
  .btn.ghost {
    background: transparent;
    color: var(--accent);
    border: 1px solid currentColor;
  }
  .btn.ghost:disabled { color: var(--dim); }

  /* ── Stage ── */
  .stage {
    flex: 1;
    position: relative;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background-color: var(--bg);
    background-image:
      linear-gradient(45deg, #141417 25%, transparent 25%),
      linear-gradient(-45deg, #141417 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #141417 75%),
      linear-gradient(-45deg, transparent 75%, #141417 75%);
    background-size: 22px 22px;
    background-position: 0 0, 0 11px, 11px -11px, -11px 0;
  }

  .stage.drag-over { outline: 2px dashed var(--accent); outline-offset: -4px; }

  .empty {
    color: var(--dim);
    font-size: 0.78rem;
    text-align: center;
    line-height: 1.7;
    pointer-events: none;
    user-select: none;
  }
  .empty small { font-size: 0.65rem; opacity: .55; display: block; margin-top: 2px; }

  canvas { max-width: 100%; max-height: 100%; display: none; }
</style>
</head>
<body>

<!-- ── Sidebar ── -->
<nav class="sidebar">
  <div class="logo">PX<br>LAB</div>

  <button class="icon-btn" id="btn-upload" title="Imagem" onclick="toggle('upload')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <circle cx="8.5" cy="8.5" r="1.5"/>
      <polyline points="21 15 16 10 5 21"/>
    </svg>
  </button>

  <button class="icon-btn" id="btn-pixel" title="Pixel" onclick="toggle('pixel')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7" rx="1"/>
      <rect x="14" y="3" width="7" height="7" rx="1"/>
      <rect x="3" y="14" width="7" height="7" rx="1"/>
      <rect x="14" y="14" width="7" height="7" rx="1"/>
    </svg>
  </button>

  <button class="icon-btn" id="btn-color" title="Cores" onclick="toggle('color')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10c1.1 0 2-.9 2-2v-.5c0-.55-.45-1-1-1H12c-2.76 0-5-2.24-5-5s2.24-5 5-5c2.76 0 5 2.24 5 5v1.5c0 .83-.67 1.5-1.5 1.5S14 13.33 14 12.5V7"/>
      <circle cx="8.5" cy="12" r="1.5" fill="currentColor" stroke="none"/>
      <circle cx="14.5" cy="9.5" r="1.5" fill="currentColor" stroke="none"/>
      <circle cx="14.5" cy="14.5" r="1.5" fill="currentColor" stroke="none"/>
    </svg>
  </button>

  <button class="icon-btn" id="btn-gap" title="Espaçamento" onclick="toggle('gap')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="2" width="8" height="8" rx="1"/>
      <rect x="14" y="2" width="8" height="8" rx="1"/>
      <rect x="2" y="14" width="8" height="8" rx="1"/>
      <rect x="14" y="14" width="8" height="8" rx="1"/>
    </svg>
  </button>

  <div class="spacer"></div>

  <button class="icon-btn" id="btn-export" title="Exportar" onclick="toggle('export')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="7 10 12 15 17 10"/>
      <line x1="12" y1="15" x2="12" y2="3"/>
    </svg>
  </button>
</nav>

<!-- ── Floating panel ── -->
<div class="float" id="float">

  <!-- upload -->
  <div class="pane visible" id="pane-upload">
    <div class="float-header"><h2>Imagem</h2></div>
    <div class="float-body">
      <label class="upload-zone">
        <svg class="ico" viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:block;margin:0 auto">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        clique ou arraste
        <div class="fname" id="fname"></div>
        <input type="file" id="file" accept="image/*">
      </label>
    </div>
  </div>

  <!-- pixel -->
  <div class="pane" id="pane-pixel">
    <div class="float-header"><h2>Pixel</h2></div>
    <div class="float-body">
      <div class="field">
        <label class="flabel">Intensidade <span class="val" id="intVal">12 px</span></label>
        <input type="range" id="intensity" min="2" max="80" value="12">
      </div>
      <div class="field">
        <label class="flabel">Formato</label>
        <select id="shape">
          <option value="square">Quadrado</option>
          <option value="circle">Círculo</option>
        </select>
      </div>
    </div>
  </div>

  <!-- color -->
  <div class="pane" id="pane-color">
    <div class="float-header"><h2>Cores</h2></div>
    <div class="float-body">
      <div class="field">
        <label class="flabel">Amostragem</label>
        <select id="sampling">
          <option value="average">Média</option>
          <option value="dominant">Cor dominante</option>
        </select>
      </div>
      <div class="field">
        <label class="flabel">Dithering</label>
        <select id="dither">
          <option value="none">Nenhum</option>
          <option value="bayer">Ordenado (Bayer)</option>
          <option value="fs">Floyd-Steinberg</option>
        </select>
      </div>
      <div class="field">
        <label class="flabel">Níveis de cor <span class="val" id="levelsVal">8 / canal</span></label>
        <input type="range" id="levels" min="2" max="16" value="8">
      </div>
    </div>
  </div>

  <!-- gap -->
  <div class="pane" id="pane-gap">
    <div class="float-header"><h2>Espaçamento</h2></div>
    <div class="float-body">
      <div class="field">
        <label class="flabel">Gap <span class="val" id="gapVal">0 %</span></label>
        <input type="range" id="gap" min="0" max="80" value="0">
      </div>
      <div class="field">
        <label class="flabel">Cor do rejunte</label>
        <input type="color" id="gapColor" value="#0e0e10">
      </div>
    </div>
  </div>

  <!-- export -->
  <div class="pane" id="pane-export">
    <div class="float-header"><h2>Exportar</h2></div>
    <div class="float-body">
      <div class="field">
        <button class="btn" id="download" disabled>Baixar PNG</button>
        <button class="btn ghost" id="downloadSvg" disabled>Baixar SVG</button>
      </div>
    </div>
  </div>

</div>

<!-- ── Canvas stage ── -->
<div class="stage" id="stage">
  <div class="empty" id="empty">
    — sem imagem —<br>
    <small>clique no ícone de imagem ou arraste um arquivo aqui</small>
  </div>
  <canvas id="canvas"></canvas>
</div>

<script>
  const fileInput      = document.getElementById('file');
  const intensity      = document.getElementById('intensity');
  const intVal         = document.getElementById('intVal');
  const shape          = document.getElementById('shape');
  const sampling       = document.getElementById('sampling');
  const dither         = document.getElementById('dither');
  const levels         = document.getElementById('levels');
  const levelsVal      = document.getElementById('levelsVal');
  const gap            = document.getElementById('gap');
  const gapVal         = document.getElementById('gapVal');
  const gapColor       = document.getElementById('gapColor');
  const canvas         = document.getElementById('canvas');
  const ctx            = canvas.getContext('2d');
  const empty          = document.getElementById('empty');
  const downloadBtn    = document.getElementById('download');
  const downloadSvgBtn = document.getElementById('downloadSvg');
  const fname          = document.getElementById('fname');
  const floatEl        = document.getElementById('float');
  const stage          = document.getElementById('stage');

  let img = null;
  let lastRender = null;
  let activePanel = null;

  // ── Panel toggle ──
  function toggle(name) {
    const wasActive = activePanel === name;

    // deactivate all btns & panes
    document.querySelectorAll('.icon-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.pane').forEach(p => p.classList.remove('visible'));

    if (wasActive) {
      floatEl.classList.remove('open');
      activePanel = null;
      return;
    }

    document.getElementById('btn-' + name).classList.add('active');
    document.getElementById('pane-' + name).classList.add('visible');
    floatEl.classList.add('open');
    activePanel = name;
  }

  // close on stage click
  stage.addEventListener('click', () => {
    if (!activePanel) return;
    floatEl.classList.remove('open');
    document.querySelectorAll('.icon-btn').forEach(b => b.classList.remove('active'));
    activePanel = null;
  });

  // ── Drag & drop on stage ──
  stage.addEventListener('dragover', e => { e.preventDefault(); stage.classList.add('drag-over'); });
  stage.addEventListener('dragleave', () => stage.classList.remove('drag-over'));
  stage.addEventListener('drop', e => {
    e.preventDefault();
    stage.classList.remove('drag-over');
    const f = e.dataTransfer.files[0];
    if (f && f.type.startsWith('image/')) loadFile(f);
  });

  // ── File load ──
  fileInput.addEventListener('change', e => {
    const f = e.target.files[0];
    if (f) loadFile(f);
  });

  function loadFile(f) {
    fname.textContent = f.name;
    fname.style.display = 'block';
    const reader = new FileReader();
    reader.onload = ev => {
      img = new Image();
      img.onload = () => {
        empty.style.display = 'none';
        canvas.style.display = 'block';
        downloadBtn.disabled = false;
        downloadSvgBtn.disabled = false;
        render();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(f);
  }

  // ── Controls → re-render ──
  intensity.addEventListener('input', () => { intVal.textContent = intensity.value + ' px'; if (img) render(); });
  shape.addEventListener('change', () => { if (img) render(); });
  sampling.addEventListener('change', () => { if (img) render(); });
  dither.addEventListener('change', () => { if (img) render(); });
  levels.addEventListener('input', () => { levelsVal.textContent = levels.value + ' / canal'; if (img) render(); });
  gap.addEventListener('input', () => { gapVal.textContent = gap.value + ' %'; if (img) render(); });
  gapColor.addEventListener('input', () => { if (img) render(); });

  // ── Bayer matrix ──
  const BAYER4 = [
    [ 0,  8,  2, 10],
    [12,  4, 14,  6],
    [ 3, 11,  1,  9],
    [15,  7, 13,  5]
  ].map(row => row.map(v => v / 16 - 0.5));

  function quantize(v, n) {
    const step = 255 / (n - 1);
    return Math.round(Math.round(v / step) * step);
  }

  function applyDither(colors, cols, rows) {
    const mode = dither.value;
    if (mode === 'none') return;
    const n = parseInt(levels.value, 10);
    const step = 255 / (n - 1);

    if (mode === 'bayer') {
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          const c = colors[y * cols + x];
          const t = BAYER4[y & 3][x & 3] * step;
          for (let ch = 0; ch < 3; ch++) {
            c[ch] = quantize(Math.min(255, Math.max(0, c[ch] + t)), n);
          }
        }
      }
    } else if (mode === 'fs') {
      const push = (x, y, ch, err, f) => {
        if (x < 0 || x >= cols || y < 0 || y >= rows) return;
        colors[y * cols + x][ch] += err * f;
      };
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          const c = colors[y * cols + x];
          for (let ch = 0; ch < 3; ch++) {
            const old = Math.min(255, Math.max(0, c[ch]));
            const nv = quantize(old, n);
            const err = old - nv;
            c[ch] = nv;
            push(x + 1, y,     ch, err, 7 / 16);
            push(x - 1, y + 1, ch, err, 3 / 16);
            push(x,     y + 1, ch, err, 5 / 16);
            push(x + 1, y + 1, ch, err, 1 / 16);
          }
        }
      }
      for (const c of colors) {
        for (let ch = 0; ch < 3; ch++) {
          c[ch] = Math.min(255, Math.max(0, Math.round(c[ch])));
        }
      }
    }
  }

  // ── Render ──
  function render() {
    const block = parseInt(intensity.value, 10);
    const maxDim = 1400;
    let w = img.width, h = img.height;
    if (w > maxDim || h > maxDim) {
      const r = Math.min(maxDim / w, maxDim / h);
      w = Math.round(w * r); h = Math.round(h * r);
    }

    const cols = Math.max(1, Math.round(w / block));
    const rows = Math.max(1, Math.round(h / block));
    const isCircle = shape.value === 'circle';
    const useDominant = sampling.value === 'dominant';
    const cell = Math.max(14, Math.round(Math.max(w / cols, h / rows)));
    const outW = cols * cell, outH = rows * cell;
    canvas.width = outW; canvas.height = outH;

    let colors;
    if (useDominant) {
      const full = document.createElement('canvas');
      full.width = w; full.height = h;
      const fctx = full.getContext('2d');
      fctx.drawImage(img, 0, 0, w, h);
      const px = fctx.getImageData(0, 0, w, h).data;
      colors = new Array(cols * rows);
      for (let by = 0; by < rows; by++) {
        for (let bx = 0; bx < cols; bx++) {
          const x0 = Math.floor(bx * w / cols), x1 = Math.floor((bx + 1) * w / cols);
          const y0 = Math.floor(by * h / rows), y1 = Math.floor((by + 1) * h / rows);
          const groups = new Map();
          let aSum = 0, aN = 0;
          for (let y = y0; y < y1; y++) {
            for (let x = x0; x < x1; x++) {
              const i = (y * w + x) * 4;
              aSum += px[i+3]; aN++;
              const key = (px[i] >> 4) << 8 | (px[i+1] >> 4) << 4 | (px[i+2] >> 4);
              let g = groups.get(key);
              if (!g) { g = { n: 0, r: 0, gr: 0, b: 0 }; groups.set(key, g); }
              g.n++; g.r += px[i]; g.gr += px[i+1]; g.b += px[i+2];
            }
          }
          let best = null;
          for (const g of groups.values()) { if (!best || g.n > best.n) best = g; }
          colors[by * cols + bx] = best
            ? [Math.round(best.r/best.n), Math.round(best.gr/best.n), Math.round(best.b/best.n), aN ? aSum/aN : 255]
            : [0, 0, 0, 0];
        }
      }
    } else {
      const tmp = document.createElement('canvas');
      tmp.width = cols; tmp.height = rows;
      const tctx = tmp.getContext('2d');
      tctx.drawImage(img, 0, 0, cols, rows);
      const data = tctx.getImageData(0, 0, cols, rows).data;
      colors = new Array(cols * rows);
      for (let k = 0; k < cols * rows; k++) {
        const i = k * 4;
        colors[k] = [data[i], data[i+1], data[i+2], data[i+3]];
      }
    }

    applyDither(colors, cols, rows);

    ctx.clearRect(0, 0, outW, outH);
    const gapPct = parseInt(gap.value, 10) / 100;
    const scale = 1 - gapPct;
    if (gapPct > 0) { ctx.fillStyle = gapColor.value; ctx.fillRect(0, 0, outW, outH); }

    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const c = colors[y * cols + x];
        ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${c[3]/255})`;
        const cx = x*cell + cell/2, cy = y*cell + cell/2;
        if (isCircle) {
          ctx.beginPath();
          ctx.arc(cx, cy, cell/2 * scale, 0, Math.PI*2);
          ctx.fill();
        } else {
          const side = cell * scale;
          ctx.fillRect(cx - side/2, cy - side/2, side, side);
        }
      }
    }
    lastRender = { colors, cols, rows, cell, outW, outH, scale, gapPct, isCircle, gapColor: gapColor.value };
  }

  // ── Export ──
  downloadBtn.addEventListener('click', () => {
    const a = document.createElement('a');
    a.download = 'pixelado.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  });

  function buildSvg(r) {
    const parts = [];
    parts.push(`<svg xmlns="http://www.w3.org/2000/svg" width="${r.outW}" height="${r.outH}" viewBox="0 0 ${r.outW} ${r.outH}">`);
    if (r.gapPct > 0) parts.push(`<rect width="${r.outW}" height="${r.outH}" fill="${r.gapColor}"/>`);
    const rnd = n => Math.round(n * 100) / 100;
    for (let y = 0; y < r.rows; y++) {
      for (let x = 0; x < r.cols; x++) {
        const c = r.colors[y * r.cols + x];
        const a = c[3] / 255;
        if (a === 0) continue;
        const fill = `rgb(${c[0]},${c[1]},${c[2]})`;
        const op = a < 1 ? ` fill-opacity="${rnd(a)}"` : '';
        const cx = x * r.cell + r.cell / 2, cy = y * r.cell + r.cell / 2;
        if (r.isCircle) {
          parts.push(`<circle cx="${rnd(cx)}" cy="${rnd(cy)}" r="${rnd(r.cell/2*r.scale)}" fill="${fill}"${op}/>`);
        } else {
          const side = r.cell * r.scale;
          parts.push(`<rect x="${rnd(cx-side/2)}" y="${rnd(cy-side/2)}" width="${rnd(side)}" height="${rnd(side)}" fill="${fill}"${op}/>`);
        }
      }
    }
    parts.push('</svg>');
    return parts.join('');
  }

  downloadSvgBtn.addEventListener('click', () => {
    if (!lastRender) return;
    const blob = new Blob([buildSvg(lastRender)], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.download = 'pixelado.svg';
    a.href = url;
    a.click();
    URL.revokeObjectURL(url);
  });
</script>
</body>
</html>
