<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wormhole</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: monospace;
    }
    canvas {
      display: block;
      background: #000;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script>
    const canvas = document.getElementById('canvas');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const ctx = canvas.getContext('2d');

    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const ringCount = 40;
    const segmentsPerRing = 128;

    let time = 0;

    // Desenho com mouse/touch
    let isDrawing = false;
    let lastX = 0, lastY = 0;
    let strokePoints = [];
    const threshold = 15;

    function normalizeStroke(points) {
      if (points.length < 2) return null;

      const minX = Math.min(...points.map(p => p.x));
      const maxX = Math.max(...points.map(p => p.x));
      const minY = Math.min(...points.map(p => p.y));
      const maxY = Math.max(...points.map(p => p.y));

      const width = maxX - minX || 1;
      const height = maxY - minY || 1;

      return points.map(p => ({
        x: (p.x - minX) / width,
        y: (p.y - minY) / height
      }));
    }

    function recognize(normalized) {
      if (!normalized || normalized.length < 5) return null;

      // Detectar curvatura
      let curveScore = 0;
      for (let i = 1; i < normalized.length - 1; i++) {
        const dx = normalized[i + 1].x - normalized[i].x;
        const dy = normalized[i + 1].y - normalized[i].y;
        const px = normalized[i].x - normalized[i - 1].x;
        const py = normalized[i].y - normalized[i - 1].y;
        curveScore += Math.abs(dx * py - dy * px);
      }
      curveScore /= normalized.length;

      const heights = normalized.map(p => p.y);
      const minH = Math.min(...heights);
      const maxH = Math.max(...heights);
      const isVertical = (maxH - minH) > 0.4;

      const widths = normalized.map(p => p.x);
      const minW = Math.min(...widths);
      const maxW = Math.max(...widths);
      const isWide = (maxW - minW) > 0.5;

      // P: curva + vertical, começando à esquerda
      if (curveScore > 0.06 && isVertical && normalized[0].x < 0.4) {
        return 'P';
      }

      // W: múltiplas ondas, bem amplo
      if (curveScore > 0.12 && isWide && isVertical) {
        return 'W';
      }

      return null;
    }

    canvas.addEventListener('mousedown', (e) => {
      isDrawing = true;
      strokePoints = [];
      lastX = e.clientX;
      lastY = e.clientY;
      strokePoints.push({ x: lastX, y: lastY });
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;
      const x = e.clientX;
      const y = e.clientY;
      const dist = Math.hypot(x - lastX, y - lastY);

      if (dist > threshold) {
        strokePoints.push({ x, y });
        lastX = x;
        lastY = y;
      }
    });

    canvas.addEventListener('mouseup', () => {
      if (!isDrawing) return;
      isDrawing = false;

      const normalized = normalizeStroke(strokePoints);
      const char = recognize(normalized);

      if (char === 'P') {
        window.location.href = 'pixel-lab.html';
      } else if (char === 'W') {
        window.location.href = 'simulador-wb-xt30ii.html';
      }
      strokePoints = [];
    });

    canvas.addEventListener('touchstart', (e) => {
      const touch = e.touches[0];
      isDrawing = true;
      strokePoints = [];
      lastX = touch.clientX;
      lastY = touch.clientY;
      strokePoints.push({ x: lastX, y: lastY });
    });

    canvas.addEventListener('touchmove', (e) => {
      if (!isDrawing) return;
      e.preventDefault();
      const touch = e.touches[0];
      const x = touch.clientX;
      const y = touch.clientY;
      const dist = Math.hypot(x - lastX, y - lastY);

      if (dist > threshold) {
        strokePoints.push({ x, y });
        lastX = x;
        lastY = y;
      }
    });

    canvas.addEventListener('touchend', () => {
      if (!isDrawing) return;
      isDrawing = false;

      const normalized = normalizeStroke(strokePoints);
      const char = recognize(normalized);

      if (char === 'P') {
        window.location.href = 'pixel-lab.html';
      } else if (char === 'W') {
        window.location.href = 'simulador-wb-xt30ii.html';
      }
      strokePoints = [];
    });

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    function drawWormhole() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#00ffff';
      ctx.lineWidth = 1;

      for (let i = 0; i < ringCount; i++) {
        const z = (i + time * 12) % ringCount;
        const depth = (z / ringCount);

        // Raio cresce para quem vem de trás para frente
        const maxRadius = Math.min(canvas.width, canvas.height) * 0.4;
        const baseRadius = maxRadius * (0.2 + depth * 0.8);

        // Opacidade maior na frente
        const opacity = Math.max(0.15, depth);
        ctx.globalAlpha = opacity;

        ctx.beginPath();

        for (let j = 0; j <= segmentsPerRing; j++) {
          const angle = (j / segmentsPerRing) * Math.PI * 2;
          const x = centerX + Math.cos(angle) * baseRadius;
          const y = centerY + Math.sin(angle) * baseRadius;

          if (j === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }

        ctx.closePath();
        ctx.stroke();
      }

      ctx.globalAlpha = 1;
    }

    function animate() {
      time += 0.016; // ~60fps
      drawWormhole();
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
