<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wormhole</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <script src="three.min.js"></script>
  <script>
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.015);

    const camera = new THREE.PerspectiveCamera(85, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      precision: 'highp',
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // ---------- tunnel mesh with distortion ----------
    const RINGS = 300; // aumentado para seamless
    const SEG = 96;
    const SPACING = 1.8;
    const RADIUS = 6.5;

    const positions = [];
    const colors = [];
    const originalPositions = [];
    const color = new THREE.Color();

    for (let i = 0; i < RINGS; i++) {
      const z = -i * SPACING;

      // Curvas sinuosas muito mais agressivas - tobogã real!
      const mainCurveX = Math.sin(i * 0.08) * 6 + Math.sin(i * 0.02) * 4;
      const mainCurveY = Math.cos(i * 0.06) * 5 + Math.sin(i * 0.03) * 4 + Math.cos(i * 0.01) * 3;

      // Loops - oscilações rápidas para criar efeito de looping
      const loopX = Math.sin(i * 0.15) * 2;
      const loopY = Math.cos(i * 0.12) * 2;

      for (let j = 0; j < SEG; j++) {
        const a = (j / SEG) * Math.PI * 2;
        const x = Math.cos(a) * RADIUS + mainCurveX + loopX;
        const y = Math.sin(a) * RADIUS + mainCurveY + loopY;
        positions.push(x, y, z);
        originalPositions.push(x, y, z);

        // Cores mais vibrantes e psicadélicas
        const t = i / RINGS;
        const hue = 0.5 + t * 0.4;
        const sat = 1.2;
        const light = 0.3 + (1 - t) * 0.5;
        color.setHSL(hue % 1, Math.min(1, sat), light);
        colors.push(color.r, color.g, color.b);
      }
    }

    const idx = [];
    for (let i = 0; i < RINGS; i++) {
      for (let j = 0; j < SEG; j++) {
        const cur = i * SEG + j;
        const nextJ = i * SEG + (j + 1) % SEG;
        idx.push(cur, nextJ);
        if (i < RINGS - 1) idx.push(cur, cur + SEG);
      }
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    geo.setIndex(idx);

    const mat = new THREE.LineBasicMaterial({
      vertexColors: true,
      transparent: true,
      opacity: 0.95,
      linewidth: 1.5,
      fog: true
    });
    const tunnel = new THREE.LineSegments(geo, mat);
    scene.add(tunnel);

    // ---------- color wave + distortion animation ----------
    let colorWaveOffset = 0;
    let distortionAmount = 0;
    let targetDistortionAmount = 0;
    let lastMovementTime = Date.now();
    const DISTORTION_DECAY_DURATION = 500; // ms

    function updateTunnelEffects() {
      const pos_arr = geo.attributes.position.array;
      const colors_arr = geo.attributes.color.array;

      for (let i = 0; i < RINGS; i++) {
        const z = -i * SPACING;
        const depth = i / RINGS;

        // Onda de cor psicadélica
        const hueShift = (depth + colorWaveOffset * 0.5 + i * 0.02) % 1;

        // Distorção suave do túnel
        const distortionFreq = 4;
        const distortWave = Math.sin(i * 0.08 + distortionAmount * 2) * distortionAmount;

        for (let j = 0; j < SEG; j++) {
          const vertexIdx = (i * SEG + j) * 3;

          // Aplicar distorção à posição
          const angle = (j / SEG) * Math.PI * 2;
          const radiusScale = 1 + distortWave * Math.sin(angle * distortionFreq);

          const dx = Math.cos(angle) * RADIUS * radiusScale;
          const dy = Math.sin(angle) * RADIUS * radiusScale;

          // Atualizar posição com distorção
          pos_arr[vertexIdx] = dx + Math.sin(i * 0.03) * 4;
          pos_arr[vertexIdx + 1] = dy + Math.cos(i * 0.025) * 3;
          pos_arr[vertexIdx + 2] = z;

          // Cores psicadélicas dinâmicas
          const hue = (0.55 + hueShift * 0.5) % 1;
          const saturation = 1.0 + Math.sin(i * 0.1 + colorWaveOffset) * 0.2;
          const lightness = 0.25 + (1 - depth) * 0.55 + Math.sin(colorWaveOffset * 2) * 0.1;

          const c = new THREE.Color().setHSL(hue, Math.min(1, saturation), Math.min(1, lightness));
          colors_arr[vertexIdx] = c.r;
          colors_arr[vertexIdx + 1] = c.g;
          colors_arr[vertexIdx + 2] = c.b;
        }
      }
      geo.attributes.position.needsUpdate = true;
      geo.attributes.color.needsUpdate = true;
    }

    // ---------- touch/mouse input para distorção ----------
    let isInteracting = false;
    let lastInteractionTime = 0;

    function triggerDistortion(intensity = 0.8) {
      targetDistortionAmount = Math.min(1, intensity);
      lastMovementTime = Date.now();
    }

    // Mouse
    renderer.domElement.addEventListener('mousedown', () => {
      isInteracting = true;
      triggerDistortion(0.7);
    });

    renderer.domElement.addEventListener('mousemove', (e) => {
      if (!isInteracting) return;
      triggerDistortion(0.8);
    });

    renderer.domElement.addEventListener('mouseup', () => {
      isInteracting = false;
    });

    renderer.domElement.addEventListener('mouseleave', () => {
      isInteracting = false;
    });

    // Touch
    renderer.domElement.addEventListener('touchstart', (e) => {
      isInteracting = true;
      triggerDistortion(0.7);
    }, { passive: true });

    renderer.domElement.addEventListener('touchmove', (e) => {
      if (!isInteracting) return;
      triggerDistortion(0.8);
    }, { passive: true });

    renderer.domElement.addEventListener('touchend', () => {
      isInteracting = false;
    }, { passive: true });

    renderer.domElement.addEventListener('touchcancel', () => {
      isInteracting = false;
    }, { passive: true });

    // ---------- giroscópio ----------
    let gyroX = 0, gyroY = 0;
    const gyroSmoothing = 0.08;

    if (window.DeviceOrientationEvent) {
      window.addEventListener('deviceorientation', (e) => {
        const beta = e.beta || 0;
        const gamma = e.gamma || 0;

        gyroY = gyroY * (1 - gyroSmoothing) + (gamma / 5) * gyroSmoothing;
        gyroX = gyroX * (1 - gyroSmoothing) + (beta / 5) * gyroSmoothing;

        gyroX = Math.max(-8, Math.min(8, gyroX));
        gyroY = Math.max(-8, Math.min(8, gyroY));
      }, true);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ---------- animation loop @ 60fps ----------
    const SPEED = 1.2; // velocidade rápida de voo (tobogã)
    let cameraZGlobal = 0; // posição global para tracking contínuo

    function animate() {
      requestAnimationFrame(animate);

      // Câmera voa reto pelo túnel, mantendo posição central
      // com leve influência do giroscópio
      camera.position.x = gyroY * 0.3;
      camera.position.y = gyroX * 0.3;

      // Avançar continuamente
      cameraZGlobal -= SPEED;

      // Posição local da câmera dentro do túnel (wraps infinitamente)
      const wrapDistance = RINGS * SPACING;
      const localZ = ((cameraZGlobal % wrapDistance) + wrapDistance) % wrapDistance;
      camera.position.z = -localZ;

      // Olhar para frente no túnel
      camera.lookAt(0, 0, camera.position.z - 15);

      // Rotação do túnel (acompanha o movimento)
      tunnel.rotation.z += 0.003;

      // Animação contínua de cores
      const baseWave = Math.sin(performance.now() * 0.0003) * 0.1;
      colorWaveOffset = baseWave;

      // Animação de distorção: interpolação suave para voltar ao normal
      const now = Date.now();
      const timeSinceMovement = now - lastMovementTime;

      if (timeSinceMovement < DISTORTION_DECAY_DURATION) {
        // Ainda está no período de decay - interpolar com easing cubic
        const progress = timeSinceMovement / DISTORTION_DECAY_DURATION;
        const easing = 1 - Math.pow(1 - progress, 3); // cubic ease-out
        distortionAmount = targetDistortionAmount * (1 - easing);
      } else {
        // Além do decay time - manter em 0
        distortionAmount = 0;
      }

      updateTunnelEffects();

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
