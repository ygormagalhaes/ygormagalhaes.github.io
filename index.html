<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLITCH</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-family: monospace;
    }

    .glitch-container {
      flex: 1;
      position: relative;
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0;
      padding: 20px;
    }

    .glitch-block {
      background: #ff00ff;
      position: absolute;
      opacity: 0.9;
      animation: glitch-move 3s infinite;
    }

    .glitch-block:nth-child(1) {
      width: 120px;
      height: 80px;
      top: 10%;
      left: 5%;
      background: #ff1493;
      animation-delay: 0s;
      clip-path: polygon(0 0, 85% 0, 100% 15%, 100% 100%, 15% 100%, 0 85%);
    }

    .glitch-block:nth-child(2) {
      width: 90px;
      height: 110px;
      top: 25%;
      right: 8%;
      background: #d946ef;
      animation-delay: 0.5s;
      clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
    }

    .glitch-block:nth-child(3) {
      width: 140px;
      height: 100px;
      bottom: 15%;
      left: 12%;
      background: #ff006e;
      animation-delay: 1s;
      clip-path: polygon(0 10%, 100% 0, 100% 90%, 0 100%);
    }

    .glitch-block:nth-child(4) {
      width: 110px;
      height: 95px;
      bottom: 20%;
      right: 15%;
      background: #c71585;
      animation-delay: 0.3s;
      clip-path: polygon(5% 0, 95% 5%, 100% 95%, 0 100%);
    }

    .glitch-block:nth-child(5) {
      width: 130px;
      height: 85px;
      top: 40%;
      left: 35%;
      background: #ff1493;
      animation-delay: 0.7s;
      clip-path: polygon(0 0, 100% 10%, 95% 100%, 0 90%);
    }

    .glitch-block:nth-child(6) {
      width: 100px;
      height: 120px;
      top: 8%;
      right: 25%;
      background: #da70d6;
      animation-delay: 0.2s;
      clip-path: polygon(10% 0, 100% 5%, 90% 100%, 0 95%);
    }

    .glitch-block:nth-child(7) {
      width: 115px;
      height: 90px;
      bottom: 10%;
      left: 50%;
      background: #ff006e;
      animation-delay: 0.9s;
      clip-path: polygon(0 15%, 100% 0, 100% 85%, 0 100%);
    }

    .glitch-block:nth-child(8) {
      width: 125px;
      height: 105px;
      top: 55%;
      right: 5%;
      background: #d946ef;
      animation-delay: 0.4s;
      clip-path: polygon(5% 0, 100% 8%, 95% 100%, 0 92%);
    }

    @keyframes glitch-move {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(-3px, 2px) rotate(0.5deg); }
      50% { transform: translate(2px, -3px) rotate(-0.5deg); }
      75% { transform: translate(-1px, 1px) rotate(0.3deg); }
    }

    .footer-nav {
      position: fixed;
      bottom: 30px;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 60px;
      z-index: 100;
    }

    .nav-link {
      font-size: 48px;
      font-weight: 900;
      color: #ff1493;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.1s ease;
      font-family: monospace;
      text-shadow: 2px 2px 0 #d946ef, 4px 4px 0 #c71585;
      letter-spacing: 8px;
    }

    .nav-link:hover {
      transform: translate(-2px, -2px);
      color: #d946ef;
      text-shadow: 4px 4px 0 #ff1493, 8px 8px 0 #ff006e;
    }

    .nav-link:nth-child(1) { color: #ff1493; }
    .nav-link:nth-child(2) { color: #d946ef; }

    @media (max-width: 640px) {
      .glitch-block {
        display: none;
      }

      .glitch-block:nth-child(1),
      .glitch-block:nth-child(2),
      .glitch-block:nth-child(5) {
        display: block;
      }

      .footer-nav {
        gap: 40px;
      }

      .nav-link {
        font-size: 36px;
        text-shadow: 1px 1px 0 #d946ef, 2px 2px 0 #c71585;
      }
    }
  </style>
</head>
<body>
  <div class="glitch-container">
    <div class="glitch-block"></div>
    <div class="glitch-block"></div>
    <div class="glitch-block"></div>
    <div class="glitch-block"></div>
    <div class="glitch-block"></div>
    <div class="glitch-block"></div>
    <div class="glitch-block"></div>
    <div class="glitch-block"></div>
  </div>

  <div class="footer-nav">
    <a href="pixel-lab.html" class="nav-link">1</a>
    <a href="wb-simulator.html" class="nav-link">2</a>
  </div>
</body>
</html>
