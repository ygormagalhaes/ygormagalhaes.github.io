<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wormhole</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    canvas {
      display: block;
      background: #000;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const canvas = document.getElementById('canvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000);
    camera.position.z = 0;

    // Criar buraco de minhoca com linhas circulares
    const lines = [];
    const ringCount = 60;
    const segmentsPerRing = 64;

    for (let i = 0; i < ringCount; i++) {
      const geometry = new THREE.BufferGeometry();
      const points = [];
      const zPos = i * 0.5 - (ringCount * 0.5) * 0.5;
      const radius = 1 + (i / ringCount) * 2;

      for (let j = 0; j <= segmentsPerRing; j++) {
        const angle = (j / segmentsPerRing) * Math.PI * 2;
        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;
        points.push(x, y, zPos);
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(points), 3));
      const material = new THREE.LineBasicMaterial({
        color: 0x00ffff,
        linewidth: 1,
        fog: false
      });
      const line = new THREE.Line(geometry, material);
      scene.add(line);
      lines.push({ line, initialZ: zPos, radius });
    }

    // Desenho com mouse
    let isDrawing = false;
    let lastX = 0, lastY = 0;
    let strokePoints = [];
    const threshold = 20;

    function normalizeStroke(points) {
      if (points.length < 2) return null;

      const minX = Math.min(...points.map(p => p.x));
      const maxX = Math.max(...points.map(p => p.x));
      const minY = Math.min(...points.map(p => p.y));
      const maxY = Math.max(...points.map(p => p.y));

      const width = maxX - minX || 1;
      const height = maxY - minY || 1;

      return points.map(p => ({
        x: (p.x - minX) / width,
        y: (p.y - minY) / height
      }));
    }

    function recognize(normalized) {
      if (!normalized || normalized.length < 5) return null;

      const centerX = 0.5;
      const getCurve = () => {
        let curveScore = 0;
        for (let i = 1; i < normalized.length - 1; i++) {
          const dx = normalized[i + 1].x - normalized[i].x;
          const dy = normalized[i + 1].y - normalized[i].y;
          const px = normalized[i].x - normalized[i - 1].x;
          const py = normalized[i].y - normalized[i - 1].y;
          curveScore += Math.abs(dx * py - dy * px);
        }
        return curveScore / normalized.length;
      };

      const isVertical = () => {
        const heights = normalized.map(p => p.y);
        const minH = Math.min(...heights);
        const maxH = Math.max(...heights);
        return (maxH - minH) > 0.6;
      };

      const curve = getCurve();
      const hasVertical = isVertical();

      // P: curva no topo, linha vertical
      if (curve > 0.08 && normalized[0].x < centerX && normalized[0].y < 0.3 && hasVertical) {
        return 'P';
      }

      // W: múltiplos picos baixos
      if (curve > 0.15 && hasVertical && normalized.some(p => p.y > 0.5)) {
        return 'W';
      }

      return null;
    }

    canvas.addEventListener('mousedown', (e) => {
      isDrawing = true;
      strokePoints = [];
      lastX = e.clientX;
      lastY = e.clientY;
      strokePoints.push({ x: lastX, y: lastY });
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;
      const x = e.clientX;
      const y = e.clientY;
      const dist = Math.hypot(x - lastX, y - lastY);

      if (dist > threshold) {
        strokePoints.push({ x, y });
        lastX = x;
        lastY = y;
      }
    });

    canvas.addEventListener('mouseup', () => {
      if (!isDrawing) return;
      isDrawing = false;

      const normalized = normalizeStroke(strokePoints);
      const char = recognize(normalized);

      if (char === 'P') {
        window.location.href = 'pixel-lab.html';
      } else if (char === 'W') {
        window.location.href = 'simulador-wb-xt30ii.html';
      }
      strokePoints = [];
    });

    canvas.addEventListener('touchstart', (e) => {
      const touch = e.touches[0];
      isDrawing = true;
      strokePoints = [];
      lastX = touch.clientX;
      lastY = touch.clientY;
      strokePoints.push({ x: lastX, y: lastY });
    });

    canvas.addEventListener('touchmove', (e) => {
      if (!isDrawing) return;
      e.preventDefault();
      const touch = e.touches[0];
      const x = touch.clientX;
      const y = touch.clientY;
      const dist = Math.hypot(x - lastX, y - lastY);

      if (dist > threshold) {
        strokePoints.push({ x, y });
        lastX = x;
        lastY = y;
      }
    });

    canvas.addEventListener('touchend', () => {
      if (!isDrawing) return;
      isDrawing = false;

      const normalized = normalizeStroke(strokePoints);
      const char = recognize(normalized);

      if (char === 'P') {
        window.location.href = 'pixel-lab.html';
      } else if (char === 'W') {
        window.location.href = 'simulador-wb-xt30ii.html';
      }
      strokePoints = [];
    });

    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Animação
    function animate() {
      requestAnimationFrame(animate);

      const time = Date.now() * 0.0005;

      lines.forEach((item, i) => {
        item.line.position.z = item.initialZ + time * 15;

        if (item.line.position.z > 30) {
          item.line.position.z -= ringCount * 0.5;
        }

        const opacity = 0.3 + 0.7 * Math.abs(Math.sin(item.line.position.z * 0.3));
        item.line.material.opacity = opacity;
      });

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
