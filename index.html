<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wormhole</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <script src="three.min.js"></script>
  <script>
    const scene = new THREE.Scene();
    // Fog hides the far folds of the loop so you only ever see the continuous
    // corridor ahead -> reads as endless depth, no detached pieces floating.
    scene.fog = new THREE.FogExp2(0x000000, 0.05);

    const camera = new THREE.PerspectiveCamera(90, window.innerWidth / window.innerHeight, 0.1, 1000);
    const BASE_FOV = 90;

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000);
    document.body.appendChild(renderer.domElement);

    // ---------- tunnel path (closed loop = truly infinite, never restarts) ----------
    // Large-scale winding loop: a wide base ring (R0) so the tunnel never folds
    // back onto itself within view distance, plus strong sine terms for very
    // sinuous, sharply curving turns. Tuned so the nearest non-local fold sits
    // ~85 units away -> hidden by fog, leaving only the continuous corridor ahead.
    const CTRL_POINTS = 40;
    const R0 = 340;
    const pathPoints = [];
    for (let i = 0; i < CTRL_POINTS; i++) {
      const a = (i / CTRL_POINTS) * Math.PI * 2;
      const x = Math.cos(a) * R0 + Math.sin(a * 3) * 80 + Math.cos(a * 5) * 45;
      const y = Math.sin(a) * R0 + Math.cos(a * 3) * 80 + Math.sin(a * 5) * 45;
      const z = Math.sin(a * 1.5) * 120 + Math.cos(a * 2.5) * 70;
      pathPoints.push(new THREE.Vector3(x, y, z));
    }

    // closed=true makes the loop seamless; tension 0.5 keeps the turns tight and winding.
    const curve = new THREE.CatmullRomCurve3(pathPoints, true, 'catmullrom', 0.5);
    const CURVE_LENGTH = curve.getLength();

    // ---------- tube geometry built as clean rings + rails ----------
    const TUBULAR = 1400;  // rings along the length (dense -> smooth over long curve)
    const RADIAL = 28;     // segments around each ring
    const TUBE_RADIUS = 14.0; // wide enough to clearly fly *inside* the corridor

    const frames = curve.computeFrenetFrames(TUBULAR, true);
    const positions = [];
    const colors = [];
    const color = new THREE.Color();

    const P = new THREE.Vector3();
    for (let i = 0; i <= TUBULAR; i++) {
      const u = i / TUBULAR;
      curve.getPointAt(u % 1, P);
      const N = frames.normals[i % TUBULAR];
      const B = frames.binormals[i % TUBULAR];

      // colour band sweeping along the tunnel (cyan / magenta / violet range)
      const hue = (0.55 + u * 1.5) % 1;
      color.setHSL(hue, 1.0, 0.55);

      for (let j = 0; j < RADIAL; j++) {
        const v = (j / RADIAL) * Math.PI * 2;
        const cx = Math.cos(v), sy = Math.sin(v);
        const x = P.x + TUBE_RADIUS * (cx * N.x + sy * B.x);
        const y = P.y + TUBE_RADIUS * (cx * N.y + sy * B.y);
        const z = P.z + TUBE_RADIUS * (cx * N.z + sy * B.z);
        positions.push(x, y, z);
        colors.push(color.r, color.g, color.b);
      }
    }

    const idx = [];
    for (let i = 0; i <= TUBULAR; i++) {
      for (let j = 0; j < RADIAL; j++) {
        const cur = i * RADIAL + j;
        const nextJ = i * RADIAL + (j + 1) % RADIAL;
        idx.push(cur, nextJ);                       // radial ring
        if (i < TUBULAR) idx.push(cur, cur + RADIAL); // longitudinal rail
      }
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    geo.setIndex(idx);

    const mat = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.9, fog: true });
    const tunnel = new THREE.LineSegments(geo, mat);
    scene.add(tunnel);

    // ---------- camera travel along the curve ----------
    let travel = 0;                 // 0..1 position along the closed loop
    const MOVE_SPEED = 6;           // world units per frame
    const tStep = MOVE_SPEED / CURVE_LENGTH;

    const camPos = new THREE.Vector3();
    const lookPos = new THREE.Vector3();
    const tangent = new THREE.Vector3();

    // ---------- interactive distortion (camera-side, cheap) ----------
    let distortion = 0;             // current 0..1
    let targetDistortion = 0;
    let lastInput = -10000;
    const DISTORTION_DURATION = 600;

    function pulse(strength) { targetDistortion = strength; lastInput = Date.now(); }
    renderer.domElement.addEventListener('mousedown', () => pulse(0.8));
    renderer.domElement.addEventListener('mousemove', (e) => { if (e.buttons) pulse(0.9); });
    renderer.domElement.addEventListener('touchstart', () => pulse(0.8), { passive: true });
    renderer.domElement.addEventListener('touchmove', () => pulse(0.9), { passive: true });

    // ---------- gyroscope ----------
    let gyroX = 0, gyroY = 0;
    if (window.DeviceOrientationEvent) {
      window.addEventListener('deviceorientation', (e) => {
        gyroY = gyroY * 0.92 + (e.gamma || 0) / 5 * 0.08;
        gyroX = gyroX * 0.92 + (e.beta || 0) / 5 * 0.08;
      }, true);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ---------- animation ----------
    let roll = 0;

    function animate() {
      requestAnimationFrame(animate);

      // advance, wrapping around the closed loop -> never ends, never restarts visibly
      travel = (travel + tStep) % 1;

      // place camera on the centreline, looking a little further down the path
      curve.getPointAt(travel, camPos);
      curve.getTangentAt(travel, tangent);
      lookPos.copy(camPos).add(tangent);

      // distortion easing
      const since = Date.now() - lastInput;
      if (since < DISTORTION_DURATION) {
        const progress = since / DISTORTION_DURATION;
        const easing = 1 - Math.pow(1 - progress, 3);
        distortion = targetDistortion * (1 - easing);
      } else {
        distortion = 0;
      }

      camera.position.copy(camPos);
      camera.lookAt(lookPos);

      // barrel-roll spin + extra spin while distorting
      roll += 0.004 + distortion * 0.05;
      camera.rotateZ(roll);

      // lateral pan from gyroscope (in camera-local space)
      camera.translateX(gyroY * 0.4);
      camera.translateY(gyroX * 0.4);

      // FOV punch + speed-wobble on interaction
      camera.fov = BASE_FOV + Math.sin(Date.now() * 0.02) * distortion * 12;
      camera.updateProjectionMatrix();

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
